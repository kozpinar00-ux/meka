<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ÖnKoç</title>
<style>
  body{
    background:#0f172a;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
    color:white;
    padding:16px;
  }
  .kutu{
    background:#020617;
    width:min(760px, 100%);
    height:min(80vh, 760px);
    border-radius:16px;
    display:flex;
    flex-direction:column;
    border:1px solid #1e293b;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .baslik{
    padding:16px;
    text-align:center;
    border-bottom:1px solid #1e293b;
    font-weight:bold;
    font-size:20px;
  }
  .sohbet{
    flex:1;
    padding:16px;
    overflow-y:auto;
  }
  .mesaj{
    padding:12px 14px;
    margin-bottom:10px;
    border-radius:12px;
    max-width:80%;
    font-size:16px;
    line-height:1.4;
    word-wrap:break-word;
  }
  .kullanici{background:#2563eb; margin-left:auto;}
  .ai{background:#334155;}
  .alt{
    display:flex;
    gap:10px;
    padding:12px;
    border-top:1px solid #1e293b;
  }
  input#giris{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:1px solid #1e293b;
    background:#0b1220;
    color:white;
    font-size:16px;
  }
  button#gonder{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
  }
</style>
</head>
<body>

<div class="kutu">
  <div class="baslik">ÖnKoç 🤖</div>
  <div id="sohbet" class="sohbet"></div>
  <div class="alt">
    <input id="giris" placeholder="Bir şey yaz..." autocomplete="off" />
    <button type="button" id="gonder">Gönder</button>
  </div>
</div>

<script>
// Basit cevaplar
const cevaplar = {
  "nasılsın": "İyiyim, sen nasılsın?",
  "iyiyim": "Güzel, iyi olmana sevindim.",
  "adın ne": "Adım ÖnKoç.",
  "ismin ne": "İsmim ÖnKoç.",
  "merhaba": "Merhaba! Ben ÖnKoç • Nasıl yardımcı olabilirim?",
  "selam": "Selam! Ben ÖnKoç • Ne konuşmak istersin?",
  "istanbul ne zaman fethedildi": "İstanbul, 29 Mayıs 1453 tarihinde II. Mehmet (Fatih Sultan Mehmet) tarafından fethedildi.",
  "türkiye'nin başkenti neresi": "Türkiye'nin başkenti Ankara'dır."
};

// UI yardımcıları
const sohbet = document.getElementById("sohbet");
const giris = document.getElementById("giris");
const buton = document.getElementById("gonder");

// Açılış
window.onload = () => {
  mesajEkle("Merhaba! Ben ÖnKoç • Nasıl yardımcı olabilirim?", "ai");
};

// Eventler
buton.addEventListener("click", gonder);
giris.addEventListener("keyup", e => { if (e.key === "Enter") gonder(); });

// Mesaj ekleme
function mesajEkle(metin, tur){
  const div = document.createElement("div");
  div.className = `mesaj ${tur}`;
  div.textContent = metin;
  sohbet.appendChild(div);
  sohbet.scrollTop = sohbet.scrollHeight;
}

// Cevap üretimi
function cevapUret(girdi){
  const temiz = girdi.trim().toLowerCase();
  if (!temiz) return "Beni çağırdın ama bir şey söylemedin gibi geldi.";

  // Saat
  if (temiz.includes("saat")) {
    const simdi = new Date();
    return "Şu an saat: " + simdi.toLocaleTimeString("tr-TR");
  }

  // Tarih
  if (temiz.includes("tarih")) {
    const simdi = new Date();
    return "Bugünün tarihi: " + simdi.toLocaleDateString("tr-TR");
  }

  // 4 işlem (regex)
  const hesapRegex = /^(\d+)\s*([\+\-\*\/])\s*(\d+)$/;
  const eslesme = temiz.match(hesapRegex);
  if (eslesme) {
    const sayi1 = parseFloat(eslesme[1]);
    const islem = eslesme[2];
    const sayi2 = parseFloat(eslesme[3]);
    let sonuc;

    switch(islem){
      case "+": sonuc = sayi1 + sayi2; break;
      case "-": sonuc = sayi1 - sayi2; break;
      case "*": sonuc = sayi1 * sayi2; break;
      case "/": 
        sonuc = sayi2 !== 0 ? (sayi1 / sayi2) : "Tanımsız (0'a bölme yapılamaz)";
        break;
    }
    return `Sonuç: ${sonuc}`;
  }

  // Doğrudan eşleşme
  if (cevaplar[temiz]) return cevaplar[temiz];

  // Anahtar kelime taraması
  const anahtarlar = Object.keys(cevaplar);
  const bul = anahtarlar.find(k => temiz.includes(k));
  if (bul) return cevaplar[bul];

  return "Bunu tam anlayamadım. Biraz daha açar mısın?";
}

// Gönder akışı
function gonder(){
  const metin = giris.value;
  if (!metin || !metin.trim()) return;

  mesajEkle(metin, "kullanici");
  giris.value = "";

  const cevap = cevapUret(metin.toLowerCase());

  setTimeout(() => {
    mesajEkle(cevap, "ai");
  }, 1000);
}
</script>
</body>
</html>
